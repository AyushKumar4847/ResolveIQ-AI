services:
  db:
    image: pgvector/pgvector:pg16
    container_name: resolveiq_db
    environment:
      POSTGRES_USER: resolveiq
      POSTGRES_PASSWORD: resolveiq
      POSTGRES_DB: resolveiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: resolveiq_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: resolveiq_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://resolveiq:resolveiq@db:5432/resolveiq
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resolveiq_frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
