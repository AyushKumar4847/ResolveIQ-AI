server {
    listen 80;
    server_name localhost;

    # 1. Frontend Static Files (React SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend Reverse Proxy (FastAPI)
    # Matches /auth, /tickets, /documents, /ask, /askllm, /docs, /openapi.json
    # as well as /api/auth, /api/tickets, etc.
    location ~ ^/(api/)?(auth|tickets|documents|ask|askllm|docs|openapi.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
